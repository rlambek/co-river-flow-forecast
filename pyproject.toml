[project]
name = "co-river-flow-forecast"
version = "0.0.1"
description = "Forecast peak flow timing and 7-day flow projections for Colorado rivers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "rlambek" }]
dependencies = [
  "dataretrieval>=1.0",
  "pandas>=2.0",
  "metloom>=0.7",
  "herbie-data>=2024.0",
  "cfgrib>=0.9",
  "xarray>=2024.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co_river_flow_forecast"]
